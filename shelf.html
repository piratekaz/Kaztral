<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Working Set — Gokul AR</title>
<meta name="description" content="An interactive shelf of Kaztral's GitHub repositories, synced live from github.com/Kaztral-ar." />
<meta name="theme-color" content="#12151a" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;1,9..144,460&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg: #12151a;
    --panel: #1b1f26;
    --panel-line: #2a2f38;
    --page: #ece5d6;
    --ink: #1b1a17;
    --ink-soft: #4a463d;
    --text: #e9e6de;
    --text-dim: #9aa0a8;
    --accent: #d9a441;

    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;

    --dyn-text: var(--text); /* flips to a dark tone when the live background is light */
  }
  body.light-bg{ --dyn-text: #14171c; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header{
    position: fixed; inset: 0 0 auto 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px 30px;
    z-index: 30;
    pointer-events: none;
    /* scrim keeps header legible regardless of the live scene color behind it */
    background: linear-gradient(to bottom, rgba(8,10,13,0.55), rgba(8,10,13,0));
  }
  header > * { pointer-events: auto; }
  .header-left{
    display: flex; align-items: center; gap: 16px;
  }
  .home-link{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.15s ease;
  }
  .home-link:hover{ color: var(--text); }
  .brand{
    display: flex; align-items: center; gap: 11px;
    text-decoration: none;
    color: var(--text);
  }
  .brand-text{
    font-family: var(--font-display);
    font-weight: 560;
    font-size: 19px;
    letter-spacing: 0.01em;
  }
  .brand-text small{
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .avatar{
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--panel-line);
    object-fit: cover;
    background: var(--panel);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .avatar.loaded{ opacity: 1; }
  .view-toggle{
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-line);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .view-toggle:hover{ background: rgba(255,255,255,0.08); border-color: #3a4048; }
  .view-toggle:focus-visible, button:focus-visible, a:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .view-toggle:disabled{ opacity: 0.4; cursor: default; }

  /* ---------- 3D stage ---------- */
  #stage{
    position: fixed; inset: 0;
    display: block;
    cursor: grab;
  }
  #stage.dragging{ cursor: grabbing; }
  #stage:active{ cursor: grabbing; }

  /* ---------- Bottom nav bar: book-by-book browsing ---------- */
  #bottomBar{
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 25;
    padding: 0 24px max(22px, env(safe-area-inset-bottom));
    color: var(--dyn-text, var(--text));
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease, color 0.35s ease;
  }
  #bottomBar.visible{ opacity: 1; }
  #bottomBar > *{ pointer-events: auto; }
  .bb-hint{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    opacity: 0.6;
    margin-bottom: 10px;
  }
  .bb-label{ margin-bottom: 16px; }
  .bb-index{
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    opacity: 0.7;
    margin-bottom: 3px;
  }
  .bb-title{
    font-family: var(--font-display);
    font-weight: 460;
    font-size: 30px;
    line-height: 1.05;
    margin: 0;
  }
  .bb-row{ display: flex; align-items: center; gap: 12px; }
  .bb-arrow{
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.85;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .bb-arrow:hover{ opacity: 1; background: rgba(128,128,128,0.15); }
  .bb-open{
    flex: 0 0 auto;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1.5px solid currentColor;
    background: transparent;
    color: inherit;
    padding: 10px 24px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .bb-open:hover{ background: rgba(128,128,128,0.15); }
  .bb-dots{
    flex: 1 1 auto;
    display: flex; align-items: center; gap: 6px;
    overflow-x: auto;
    min-width: 0;
    padding: 4px 2px;
  }
  .bb-dot{
    flex: 0 0 auto;
    width: 16px; height: 2px;
    border: none; padding: 0;
    background: currentColor;
    opacity: 0.35;
    cursor: pointer;
    border-radius: 1px;
    transition: width 0.2s ease, opacity 0.2s ease;
  }
  .bb-dot:hover{ opacity: 0.7; }
  .bb-dot.active{ width: 28px; opacity: 1; }

  /* ---------- Loading / error overlays ---------- */
  #loadingOverlay, #errorOverlay{
    position: fixed; inset: 0;
    z-index: 60;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  #errorOverlay{ display: none; }
  #errorOverlay.visible{ display: flex; }
  .loading-inner, .error-inner{ max-width: 340px; padding: 0 24px; }
  .spinner{
    width: 22px; height: 22px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 2px solid var(--panel-line);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .loading-inner p, .error-inner p{
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .loading-inner span{ color: var(--text); }
  .error-inner p#errorMsg{ color: var(--text); font-size: 14px; margin-bottom: 18px; }
  .error-actions{ display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .error-actions button, .error-actions a{
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    padding: 9px 14px;
    border-radius: 3px;
    border: 1px solid var(--panel-line);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
  }
  .error-actions button:hover, .error-actions a:hover{ background: rgba(255,255,255,0.08); }

  /* ---------- Detail panel ---------- */
  #detail{
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(400px, 92vw);
    background: var(--panel);
    border-left: 1px solid var(--panel-line);
    z-index: 40;
    padding: 84px 32px 32px;
    transform: translateX(100%);
    transition: transform 0.45s cubic-bezier(.22,.85,.32,1);
    overflow-y: auto;
  }
  #detail.open{ transform: translateX(0); }

  .detail-index{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--detail-accent, var(--accent));
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .detail-title{
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 6px;
  }
  .detail-sub{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 22px;
  }
  .detail-desc{
    font-size: 14.5px;
    line-height: 1.65;
    color: #cfd1d6;
    margin-bottom: 24px;
  }
  .detail-tags{
    display: flex; flex-wrap: wrap; gap: 7px;
    margin-bottom: 26px;
  }
  .detail-tags span{
    font-family: var(--font-mono);
    font-size: 10.5px;
    border: 1px solid var(--panel-line);
    padding: 4px 9px;
    border-radius: 20px;
    color: var(--text-dim);
  }
  .detail-link{
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--detail-accent, var(--accent));
    padding-bottom: 2px;
  }
  .detail-close{
    position: absolute;
    top: 30px; right: 28px;
    background: none; border: none;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .detail-close:hover{ color: var(--text); }
  .detail-nav{
    position: absolute;
    bottom: 32px; left: 32px; right: 32px;
    display: flex; justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .detail-nav button{
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; letter-spacing: 0.04em;
  }
  .detail-nav button:hover{ color: var(--text); }

  /* ---------- Static catalog (fallback + toggle view) ---------- */
  #catalog{
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 50;
    overflow-y: auto;
    padding: 100px 24px 60px;
    display: none;
  }
  #catalog.visible{ display: block; }
  .catalog-inner{ max-width: 720px; margin: 0 auto; }
  .catalog-intro{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 40px;
    line-height: 1.6;
  }
  .catalog-intro a{ color: var(--text); }
  .catalog-item{
    border-top: 1px solid var(--panel-line);
    padding: 26px 0;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 18px;
  }
  .catalog-item:last-child{ border-bottom: 1px solid var(--panel-line); }
  .catalog-num{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--catalog-accent, var(--accent));
    padding-top: 4px;
  }
  .catalog-item h3{
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 560;
    margin: 0 0 4px;
  }
  .catalog-item .cat-sub{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .catalog-item p{
    font-size: 13.5px;
    line-height: 1.6;
    color: #cfd1d6;
    margin: 0 0 12px;
    max-width: 56ch;
  }
  .catalog-item a{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    border-bottom: 1px solid var(--catalog-accent, var(--accent));
  }

  /* No-WebGL fallback: force catalog on, hide 3D-only chrome */
  body.no-webgl #stage,
  body.no-webgl #bottomBar,
  body.no-webgl .view-toggle{ display: none; }
  body.no-webgl #catalog{ display: block; }

  @media (prefers-reduced-motion: reduce){
    #detail{ transition: none; }
    .spinner{ animation-duration: 1.6s; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="home-link" href="index.html" aria-label="Back to Kaztral's site">← Home</a>
    <a class="brand" id="brandLink" href="https://github.com/Kaztral-ar" target="_blank" rel="noopener noreferrer">
      <img class="avatar" id="avatarImg" alt="" />
      <span class="brand-text">Working Set<small id="brandSub">KAZTRAL · SYNCING WITH GITHUB…</small></span>
    </a>
  </div>
  <button class="view-toggle" id="toggleView" aria-pressed="false" disabled>Static catalog</button>
</header>

<canvas id="stage" aria-hidden="true"></canvas>

<div id="bottomBar">

  <div class="bb-label">

  </div>
  <div class="bb-row">
    <button class="bb-arrow" id="bbPrev" aria-label="Previous book">‹</button>

</div>

<aside id="detail" aria-live="polite">

  <div class="detail-nav">
    <button id="navPrev">← prev</button>
    <button id="navNext">next →</button>
  </div>
</aside>

<section id="catalog" aria-label="Static project catalog">
  <div class="catalog-inner">
    <p class="catalog-intro" id="catalogIntro">Loading…</p>
    <div id="catalogList"></div>
  </div>
</section>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------
   Live GitHub data layer
   The shelf is populated from the GitHub REST API at load time —
   nothing about the project list is hardcoded. Edit EXCLUDE_REPOS
   below to manually curate a name off the shelf (e.g. tutorial
   forks with no original work).
----------------------------------------------------------------*/
const GITHUB_USERNAME = 'Kaztral-ar';
const MAX_BOOKS = 9;
const EXCLUDE_REPOS = new Set(['first-contributions']);
const CACHE_KEY = 'kaztral-shelf-cache-v1';
const CACHE_TTL_MS = 15 * 60 * 1000;
const ACCENTS = ['#4fb0a5', '#d9a441', '#5b7c99', '#a35d3f', '#7a8c5f', '#8a5a7a', '#8b8f96', '#6f9bd6', '#c76b6b', '#6fa87a'];

let PROJECTS = []; // populated by bootstrap() before initShelf()/buildCatalog() run

async function fetchGitHubData(){
  try{
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (cached && Date.now() - cached.ts < CACHE_TTL_MS) return cached.data;
  }catch(e){ /* corrupt cache — ignore and refetch */ }

  const [userRes, reposRes] = await Promise.all([
    fetch(`https://api.github.com/users/${GITHUB_USERNAME}`, { headers: { Accept: 'application/vnd.github+json' } }),
    fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated&type=owner`, { headers: { Accept: 'application/vnd.github+json' } })
  ]);

  if (!userRes.ok || !reposRes.ok){
    const failed = !reposRes.ok ? reposRes : userRes;
    const remaining = failed.headers.get('x-ratelimit-remaining');
    const err = new Error(
      failed.status === 403 || remaining === '0'
        ? 'GitHub API rate limit reached. Unauthenticated requests are capped at 60/hour.'
        : failed.status === 404
          ? `GitHub user "${GITHUB_USERNAME}" not found.`
          : `GitHub API returned an error (HTTP ${failed.status}).`
    );
    err.status = failed.status;
    throw err;
  }

  const user = await userRes.json();
  const repos = await reposRes.json();
  const data = { user, repos };
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); }catch(e){ /* storage full/blocked — non-fatal */ }
  return data;
}

function titleCase(name){
  return name.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function formatMonth(iso){
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}

function buildSub(repo){
  const parts = [];
  if (repo.language) parts.push(repo.language);
  parts.push(`updated ${formatMonth(repo.pushed_at)}`);
  if (repo.fork) parts.push('fork');
  if (repo.archived) parts.push('archived');
  return parts.join(' · ');
}

function buildTags(repo){
  const tags = [];
  if (repo.language) tags.push(repo.language);
  if (Array.isArray(repo.topics)) tags.push(...repo.topics.slice(0, 4));
  if (repo.stargazers_count > 0) tags.push(`★ ${repo.stargazers_count}`);
  return tags.length ? tags : ['No topics set'];
}

/* Repos are included if they're original work, or forks the owner
   has annotated with their own description (a reasonable signal
   the fork represents real contribution, not just a clone). */
function buildProjectsFromRepos(repos){
  const filtered = repos
    .filter(r => !EXCLUDE_REPOS.has(r.name))
    .filter(r => !r.fork || (r.fork && r.description))
    .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));

  const shown = filtered.slice(0, MAX_BOOKS);
  const projects = shown.map((r, i) => ({
    title: titleCase(r.name),
    sub: buildSub(r),
    desc: r.description || 'No description provided yet.',
    tags: buildTags(r),
    link: r.html_url,
    accent: ACCENTS[i % ACCENTS.length]
  }));

  if (filtered.length > MAX_BOOKS){
    projects.push({
      title: 'More on GitHub',
      sub: `${filtered.length - MAX_BOOKS} more repositories`,
      desc: `The shelf shows the ${MAX_BOOKS} most recently updated repositories. Open the full profile to see the rest.`,
      tags: [],
      link: `https://github.com/${GITHUB_USERNAME}`,
      accent: '#5c6470'
    });
  }
  return projects;
}

/* ---------------------------------------------------------------
   WebGL capability check — fail safe into the static catalog.
----------------------------------------------------------------*/
function hasWebGL(){
  try{
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext &&
      (c.getContext('webgl') || c.getContext('experimental-webgl')));
  }catch(e){ return false; }
}

/* ---------------------------------------------------------------
   Static catalog — the accessible source of truth and the
   no-WebGL fallback. Rebuilt each time PROJECTS changes.
----------------------------------------------------------------*/
function buildCatalog(){
  const intro = document.getElementById('catalogIntro');
  intro.innerHTML = `Working Set — live from <a href="https://github.com/${GITHUB_USERNAME}" target="_blank" rel="noopener noreferrer">github.com/${GITHUB_USERNAME}</a>, most recently updated first.`;

  const list = document.getElementById('catalogList');
  list.innerHTML = '';
  const frag = document.createDocumentFragment();
  PROJECTS.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'catalog-item';
    item.style.setProperty('--catalog-accent', p.accent);
    item.innerHTML = `
      <div class="catalog-num">${String(i + 1).padStart(2, '0')}</div>
      <div>
        <h3>${p.title}</h3>
        <div class="cat-sub">${p.sub}</div>
        <p>${p.desc}</p>
        <a href="${p.link}" target="_blank" rel="noopener noreferrer">View on GitHub →</a>
      </div>`;
    frag.appendChild(item);
  });
  list.appendChild(frag);
}

const toggleBtn = document.getElementById('toggleView');
const catalogEl = document.getElementById('catalog');
let catalogVisible = false;
function setCatalogVisible(v){
  catalogVisible = v;
  catalogEl.classList.toggle('visible', v);
  toggleBtn.setAttribute('aria-pressed', String(v));
  toggleBtn.textContent = v ? 'View shelf' : 'Static catalog';
}
toggleBtn.addEventListener('click', () => setCatalogVisible(!catalogVisible));

/* ---------------------------------------------------------------
   Bootstrap: fetch → build data → render shelf/catalog
----------------------------------------------------------------*/
const loadingEl = document.getElementById('loadingOverlay');
const errorEl = document.getElementById('errorOverlay');
const errorMsgEl = document.getElementById('errorMsg');
const avatarImg = document.getElementById('avatarImg');
const brandSub = document.getElementById('brandSub');
const bottomBarEl = document.getElementById('bottomBar');

function updateHeader(user){
  if (user.avatar_url){
    avatarImg.src = user.avatar_url;
    avatarImg.alt = user.login || GITHUB_USERNAME;
    avatarImg.addEventListener('load', () => avatarImg.classList.add('loaded'), { once: true });
  }
  brandSub.textContent = `${user.login || GITHUB_USERNAME} · ${user.public_repos ?? '—'} public repos`;
}

async function bootstrap(){
  loadingEl.style.display = 'flex';
  errorEl.classList.remove('visible');
  try{
    const { user, repos } = await fetchGitHubData();
    PROJECTS = buildProjectsFromRepos(Array.isArray(repos) ? repos : []);
    updateHeader(user);
    loadingEl.style.display = 'none';

    if (PROJECTS.length === 0){
      throw Object.assign(new Error('No public repositories matched the shelf criteria.'), { status: 'empty' });
    }

    buildCatalog();
    toggleBtn.disabled = false;

    if (hasWebGL()){
      initShelf();
      bottomBarEl.classList.add('visible');
    } else {
      document.body.classList.add('no-webgl');
      setCatalogVisible(true);
    }
  }catch(err){
    loadingEl.style.display = 'none';
    errorMsgEl.textContent = err.message || 'Failed to load repositories from GitHub.';
    errorEl.classList.add('visible');
  }
}
document.getElementById('retryBtn').addEventListener('click', () => {
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  bootstrap();
});
bootstrap();

/* ---------------------------------------------------------------
   3D shelf
----------------------------------------------------------------*/
function initShelf(){
  const canvas = document.getElementById('stage');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x12151a);
  scene.fog = new THREE.Fog(0x12151a, 9, 22);

  // The scene background tracks the currently selected book's cover
  // color, eased each frame; bgTarget is the color selectBook() aims at.
  const bgTarget = new THREE.Color(0x12151a);
  function relativeLuminance(hex){
    const c = new THREE.Color(hex);
    return 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
  }
  function setBackgroundTarget(hex){
    bgTarget.set(hex);
    document.body.classList.toggle('light-bg', relativeLuminance(hex) > 0.6);
  }

  const camera = new THREE.PerspectiveCamera(
    38, window.innerWidth / window.innerHeight, 0.1, 100
  );
  const camZ = Math.min(13, Math.max(7, 6 + PROJECTS.length * 0.4));
  const REST_POS = new THREE.Vector3(0, 1.1, camZ);
  camera.position.copy(REST_POS);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xfff3e0, 1.1);
  key.position.set(4, 6, 6);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x6f9bd6, 0.4);
  rim.position.set(-5, 3, -4);
  scene.add(rim);

  // Shelf plank — width scales with how many books are on it
  const SPACING = 1.05;
  const totalWidth = Math.max(0, (PROJECTS.length - 1) * SPACING);
  const plankGeo = new THREE.BoxGeometry(totalWidth + 2.0, 0.18, 1.2);
  const plankMat = new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: 0.85 });
  const plank = new THREE.Mesh(plankGeo, plankMat);
  plank.position.set(0, -1.02, 0);
  scene.add(plank);

  // Controls — orbit the background scene when nothing is focused
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = Math.max(4, camZ - 3.5);
  controls.maxDistance = camZ + 4.5;
  controls.maxPolarAngle = Math.PI * 0.62;
  controls.minPolarAngle = Math.PI * 0.28;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;
  controls.update();

  canvas.addEventListener('pointerdown', () => canvas.classList.add('dragging'));
  window.addEventListener('pointerup', () => canvas.classList.remove('dragging'));

  /* ---- Cover texture: title + index drawn onto a canvas ---- */
  function wrapText(ctx, text, x, y, maxWidth, lineHeight){
    const words = text.split(' ');
    let line = '', lines = [];
    for (const word of words){
      const test = line + word + ' ';
      if (ctx.measureText(test).width > maxWidth && line){
        lines.push(line); line = word + ' ';
      } else { line = test; }
    }
    lines.push(line);
    const startY = y - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach((l, i) => ctx.fillText(l.trim(), x, startY + i * lineHeight));
  }

  function makeCoverTexture(project, index){
    const w = 512, h = 768;
    const cvs = document.createElement('canvas');
    cvs.width = w; cvs.height = h;
    const ctx = cvs.getContext('2d');

    ctx.fillStyle = project.accent;
    ctx.fillRect(0, 0, w, h);

    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(0,0,0,0.18)');
    grad.addColorStop(0.5, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 3;
    ctx.strokeRect(24, 24, w - 48, h - 48);

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = '600 26px "JetBrains Mono", monospace';
    ctx.fillText(String(index + 1).padStart(2, '0'), 48, 84);

    ctx.font = '460 40px "Fraunces", serif';
    wrapText(ctx, project.title, 48, h / 2 - 20, w - 96, 48);

    ctx.font = '400 16px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('GITHUB.COM/' + GITHUB_USERNAME.toUpperCase(), 48, h - 56);

    const tex = new THREE.CanvasTexture(cvs);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }

  function makeSpineTexture(project, index){
    const w = 128, h = 768;
    const cvs = document.createElement('canvas');
    cvs.width = w; cvs.height = h;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = project.accent;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.translate(w / 2 + 8, h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = '460 26px "Fraunces", serif';
    ctx.textAlign = 'center';
    ctx.fillText(project.title, 0, 0);
    ctx.restore();

    ctx.font = '400 13px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.textAlign = 'left';
    ctx.fillText(String(index + 1).padStart(2, '0'), 14, h - 28);

    const tex = new THREE.CanvasTexture(cvs);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  /* ---- Build one book group per project ---- */
  const BOOK_W = 0.68, BOOK_H = 1.9, BOOK_D = 1.0;
  const BASE_Y = -1.02 + 0.09 + BOOK_H / 2;

  const books = [];
  const raycastTargets = [];

  PROJECTS.forEach((project, i) => {
    const group = new THREE.Group();
    group.position.x = -totalWidth / 2 + i * SPACING;
    group.position.y = BASE_Y;

    const bodyGeo = new THREE.BoxGeometry(BOOK_W * 0.92, BOOK_H * 0.96, BOOK_D * 0.94);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xece5d6, roughness: 0.95 });
    group.add(new THREE.Mesh(bodyGeo, bodyMat));

    const spineTex = makeSpineTexture(project, i);
    const spineGeo = new THREE.BoxGeometry(0.04, BOOK_H, BOOK_D);
    const spineMat = new THREE.MeshStandardMaterial({ map: spineTex, roughness: 0.6 });
    const spine = new THREE.Mesh(spineGeo, spineMat);
    spine.position.x = -BOOK_W / 2;
    group.add(spine);

    const coverPivot = new THREE.Group();
    coverPivot.position.set(-BOOK_W / 2, 0, BOOK_D / 2);
    const coverTex = makeCoverTexture(project, i);
    const coverGeo = new THREE.BoxGeometry(BOOK_W, BOOK_H, 0.05);
    coverGeo.translate(BOOK_W / 2, 0, 0);
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
    const coverMat = [darkMat, darkMat, darkMat, darkMat,
      new THREE.MeshStandardMaterial({ map: coverTex, roughness: 0.55 }), // front
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 })  // back
    ];
    coverPivot.add(new THREE.Mesh(coverGeo, coverMat));
    group.add(coverPivot);

    const hitGeo = new THREE.BoxGeometry(BOOK_W * 1.3, BOOK_H * 1.05, BOOK_D * 1.3);
    const hit = new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({ visible: false }));
    hit.userData.bookIndex = i;
    group.add(hit);
    raycastTargets.push(hit);

    scene.add(group);
    books.push({ group, coverPivot, project, index: i, isOpen: false, openT: 0, hoverT: 0 });
  });

  /* ---- Interaction state ----
     `focusedIndex` is the book currently centered/stepped-forward
     (browsing) — always valid once loaded. `isOpen` on that book
     (cover flipped + detail panel) is a separate toggle layered on
     top, driven by the Open/Close button or a direct click. */
  let focusedIndex = -1;
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let downPos = null;

  function toNDC(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  }

  const detailEl = document.getElementById('detail');
  const dIndex = document.getElementById('dIndex');
  const dTitle = document.getElementById('dTitle');
  const dSub = document.getElementById('dSub');
  const dDesc = document.getElementById('dDesc');
  const dTags = document.getElementById('dTags');
  const dLink = document.getElementById('dLink');

  const bbIndex = document.getElementById('bbIndex');
  const bbTitle = document.getElementById('bbTitle');
  const bbOpen = document.getElementById('bbOpen');
  const bbDots = document.getElementById('bbDots');

  // Build one progress dot per book, each jumping straight to it.
  PROJECTS.forEach((p, i) => {
    const dot = document.createElement('button');
    dot.className = 'bb-dot';
    dot.type = 'button';
    dot.setAttribute('role', 'tab');
    dot.setAttribute('aria-label', p.title);
    dot.addEventListener('click', () => selectBook(i));
    bbDots.appendChild(dot);
  });

  function refreshChrome(){
    const p = PROJECTS[focusedIndex];
    bbIndex.textContent = `${String(focusedIndex + 1).padStart(2, '0')} / ${String(PROJECTS.length).padStart(2, '0')}`;
    bbTitle.textContent = p.title;
    bbOpen.textContent = books[focusedIndex].isOpen ? 'Close' : 'Open';
    [...bbDots.children].forEach((dot, i) => dot.classList.toggle('active', i === focusedIndex));
  }

  function showDetail(i){
    const p = PROJECTS[i];
    detailEl.style.setProperty('--detail-accent', p.accent);
    dIndex.textContent = `VOL. ${String(i + 1).padStart(2, '0')} / ${PROJECTS.length}`;
    dTitle.textContent = p.title;
    dSub.textContent = p.sub;
    dDesc.textContent = p.desc;
    dTags.innerHTML = p.tags.map(t => `<span>${t}</span>`).join('');
    dLink.href = p.link;
    dLink.textContent = 'View on GitHub →';
    detailEl.classList.add('open');
  }
  function hideDetail(){ detailEl.classList.remove('open'); }

  // Browse to book i — brings it forward, updates the live
  // background color and chrome, but leaves the cover closed.
  function selectBook(i){
    if (focusedIndex !== -1 && books[focusedIndex].isOpen){
      books[focusedIndex].isOpen = false;
      hideDetail();
    }
    focusedIndex = i;
    setBackgroundTarget(PROJECTS[i].accent);
    refreshChrome();
  }

  function openSelected(){
    if (focusedIndex === -1) return;
    books[focusedIndex].isOpen = true;
    controls.autoRotate = false;
    showDetail(focusedIndex);
    refreshChrome();
  }
  function closeSelected(){
    if (focusedIndex === -1) return;
    books[focusedIndex].isOpen = false;
    controls.autoRotate = true;
    hideDetail();
    refreshChrome();
  }
  function selectAndOpen(i){ selectBook(i); openSelected(); }

  canvas.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });

  canvas.addEventListener('pointerup', (e) => {
    if (!downPos) return;
    const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    downPos = null;
    if (moved > 6) return; // was a drag, not a click

    toNDC(e.clientX, e.clientY);
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(raycastTargets, false);
    if (hits.length){
      selectAndOpen(hits[0].object.userData.bookIndex);
    } else if (focusedIndex !== -1 && books[focusedIndex].isOpen){
      closeSelected();
    }
  });

  window.addEventListener('keydown', (e) => {
    if (catalogVisible || focusedIndex === -1) return;
    if (e.key === 'Escape'){ closeSelected(); return; }
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); books[focusedIndex].isOpen ? closeSelected() : openSelected(); return; }
    const wasOpen = books[focusedIndex].isOpen;
    if (e.key === 'ArrowRight'){ const n = (focusedIndex + 1) % PROJECTS.length; wasOpen ? selectAndOpen(n) : selectBook(n); }
    if (e.key === 'ArrowLeft'){ const n = (focusedIndex - 1 + PROJECTS.length) % PROJECTS.length; wasOpen ? selectAndOpen(n) : selectBook(n); }
  });

  // While a book is open, the wheel cycles books instead of zooming.
  canvas.addEventListener('wheel', (e) => {
    if (focusedIndex === -1 || !books[focusedIndex].isOpen) return;
    e.preventDefault();
    const dir = e.deltaY > 0 ? 1 : -1;
    selectAndOpen((focusedIndex + dir + PROJECTS.length) % PROJECTS.length);
  }, { passive: false });

  document.getElementById('detailClose').addEventListener('click', closeSelected);
  document.getElementById('navPrev').addEventListener('click', () =>
    selectAndOpen((focusedIndex - 1 + PROJECTS.length) % PROJECTS.length));
  document.getElementById('navNext').addEventListener('click', () =>
    selectAndOpen((focusedIndex + 1) % PROJECTS.length));

  document.getElementById('bbPrev').addEventListener('click', () => {
    const wasOpen = focusedIndex !== -1 && books[focusedIndex].isOpen;
    const n = (focusedIndex - 1 + PROJECTS.length) % PROJECTS.length;
    wasOpen ? selectAndOpen(n) : selectBook(n);
  });
  document.getElementById('bbNext').addEventListener('click', () => {
    const wasOpen = focusedIndex !== -1 && books[focusedIndex].isOpen;
    const n = (focusedIndex + 1) % PROJECTS.length;
    wasOpen ? selectAndOpen(n) : selectBook(n);
  });
  bbOpen.addEventListener('click', () => {
    if (focusedIndex === -1) return;
    books[focusedIndex].isOpen ? closeSelected() : openSelected();
  });

  toggleBtn.addEventListener('click', () => { if (!catalogVisible) closeSelected(); });

  // Land on the first book with the background already easing toward it.
  selectBook(0);

  /* ---- Animation loop ---- */
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    scene.background.lerp(bgTarget, Math.min(dt * 3, 1));
    scene.fog.color.copy(scene.background);

    books.forEach(b => {
      const targetT = b.isOpen ? 1 : 0;
      b.openT += (targetT - b.openT) * Math.min(dt * 6, 1);
      b.coverPivot.rotation.y = -b.openT * (Math.PI * 0.78);

      const targetHover = (b.index === focusedIndex) ? 1 : 0;
      b.hoverT += (targetHover - b.hoverT) * Math.min(dt * 5, 1);
      b.group.position.z = b.hoverT * 1.4;
      b.group.position.y = BASE_Y + b.hoverT * 0.12;
      b.group.rotation.y = b.hoverT * 0.15;
    });

    // Pan the orbit target to the focused book's x-position so it's
    // the centered subject of the frame, not just whichever book
    // happens to sit near the shelf's midpoint. When its detail panel
    // is open, nudge the aim point further right so the book itself
    // settles left of center, clear of the panel instead of behind it.
    if (focusedIndex !== -1){
      const bookX = books[focusedIndex].group.position.x;
      const panelFrac = books[focusedIndex].isOpen
        ? Math.min(400, window.innerWidth * 0.92) / window.innerWidth
        : 0;
      const dist = camera.position.distanceTo(controls.target);
      const halfWidth = Math.tan(camera.fov * Math.PI / 360) * dist * camera.aspect;
      const desiredX = bookX + panelFrac * halfWidth;
      controls.target.x += (desiredX - controls.target.x) * Math.min(dt * 4, 1);
    }

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  function onResize(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onResize);
}
</script>
